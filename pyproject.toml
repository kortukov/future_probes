[project]
name = "future-probes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6.0",
    "transformers==4.57.6",
    "datasets>=2.15.0,<4.0.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "einops>=0.8.1",
    "nltk>=3.9.1",
    "vllm>=0.8.0",
    "ray",
    "scikit-learn",
    "bitsandbytes>=0.45.0",
    "numpy",
    "nnsight==0.6.2",
    "openai-harmony>=0.0.8",
    "matplotlib>=3.10.9",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
name = "pypi"
default = true

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
name = "pytorch-cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.uv]
environments = ["sys_platform == 'linux'"]
